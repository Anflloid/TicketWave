openapi: 3.0.3
info:
  title: TicketWave Booking API
  version: 1.0.0
  description: |
    Публічний REST API модуля Booking системи TicketWave.
    Через нього Web App (Angular) і Mobile App переглядають місця на події,
    бронюють їх, змінюють і скасовують бронювання.
    Усі помилки 4xx/5xx повертаються у форматі RFC 7807 (application/problem+json).
  contact:
    name: Киселевич Андрій
    url: https://github.com/Anflloid/TicketWave
servers:
  - url: https://api.ticketwave.example/v1
    description: Production
  - url: http://127.0.0.1:4010
    description: Prism mock server
security:
  - bearerAuth: []
tags:
  - name: Seats
    description: Місця на події
  - name: Reservations
    description: Бронювання місць

paths:
  /events/{eventId}/seats:
    get:
      tags: [Seats]
      operationId: listEventSeats
      summary: Список місць на події з фільтрами
      description: Повертає місця для схеми залу. Можна відфільтрувати за статусом, сектором і максимальною ціною.
      security: []
      parameters:
        - $ref: '#/components/parameters/EventId'
        - name: status
          in: query
          required: false
          description: Показати тільки місця з цим статусом
          schema:
            $ref: '#/components/schemas/SeatStatus'
        - name: sectorId
          in: query
          required: false
          description: Показати тільки місця одного сектора
          schema:
            type: string
            format: uuid
          example: 5b1f6c2e-0d3a-4c8e-9a51-2f7d1e8c4b10
        - name: maxPrice
          in: query
          required: false
          description: Максимальна ціна в гривнях
          schema:
            type: number
            format: double
            minimum: 0
          example: 1500
      responses:
        '200':
          description: Список місць
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /reservations:
    post:
      tags: [Reservations]
      operationId: createReservation
      summary: Забронювати місця
      description: |
        Ставить тимчасовий резерв на обрані місця на 10 хвилин.
        Якщо хоч одне місце вже зайняте, не бронюється жодне (409).
        На одну подію акаунт може мати не більше 4 квитків (422).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReservationRequest'
      responses:
        '201':
          description: Бронювання створено
          headers:
            Location:
              description: Адреса створеного бронювання
              schema:
                type: string
              example: /reservations/0e7c2a91-4b6d-4f3e-8a2c-91d5b7e4f003
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SeatConflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /reservations/{reservationId}:
    parameters:
      - $ref: '#/components/parameters/ReservationId'
    get:
      tags: [Reservations]
      operationId: getReservation
      summary: Отримати бронювання
      description: Повертає бронювання з місцями, сумою і часом, до якого діє резерв.
      responses:
        '200':
          description: Бронювання знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Reservations]
      operationId: updateReservation
      summary: Змінити бронювання (додати або прибрати страховку)
      description: Працює тільки поки бронювання в статусі ACTIVE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReservationRequest'
      responses:
        '200':
          description: Бронювання оновлено, сума перерахована
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Reservations]
      operationId: deleteReservation
      summary: Скасувати бронювання
      description: Знімає резерв, місця знову стають вільними.
      responses:
        '204':
          description: Бронювання скасовано
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token від Keycloak (OIDC)

  parameters:
    EventId:
      name: eventId
      in: path
      required: true
      description: Ідентифікатор події
      schema:
        type: string
        format: uuid
      example: 9c4e1a7b-2f3d-4e6a-8b1c-7d2e5f9a3c01
    ReservationId:
      name: reservationId
      in: path
      required: true
      description: Ідентифікатор бронювання
      schema:
        type: string
        format: uuid
      example: 0e7c2a91-4b6d-4f3e-8a2c-91d5b7e4f003

  schemas:
    SeatStatus:
      type: string
      description: Статус місця на події
      enum: [FREE, RESERVED, SOLD, BLOCKED]
      example: FREE

    ReservationStatus:
      type: string
      description: Статус бронювання
      enum: [ACTIVE, PAID, CANCELLED, EXPIRED]
      example: ACTIVE

    EventSeat:
      type: object
      required: [id, sectorId, sectorName, row, number, price, status]
      properties:
        id:
          type: string
          format: uuid
          example: 3f8a2c1d-6e4b-4a9f-b2d7-1c5e8f0a9b22
        sectorId:
          type: string
          format: uuid
          example: 5b1f6c2e-0d3a-4c8e-9a51-2f7d1e8c4b10
        sectorName:
          type: string
          maxLength: 50
          example: Фан-зона A
        row:
          type: integer
          format: int32
          minimum: 1
          example: 5
        number:
          type: integer
          format: int32
          minimum: 1
          example: 12
        price:
          type: number
          format: double
          minimum: 0
          description: Ціна в гривнях
          example: 1200
        status:
          $ref: '#/components/schemas/SeatStatus'
        x:
          type: number
          format: double
          description: Координата X для малювання на схемі залу
          example: 412.5
        y:
          type: number
          format: double
          description: Координата Y для малювання на схемі залу
          example: 188

    SeatList:
      type: object
      required: [eventId, items, total]
      properties:
        eventId:
          type: string
          format: uuid
          example: 9c4e1a7b-2f3d-4e6a-8b1c-7d2e5f9a3c01
        total:
          type: integer
          format: int32
          minimum: 0
          example: 2
        items:
          type: array
          items:
            $ref: '#/components/schemas/EventSeat'
          example:
            - id: 3f8a2c1d-6e4b-4a9f-b2d7-1c5e8f0a9b22
              sectorId: 5b1f6c2e-0d3a-4c8e-9a51-2f7d1e8c4b10
              sectorName: Фан-зона A
              row: 5
              number: 12
              price: 1200
              status: FREE
              x: 412.5
              y: 188
            - id: 7a1b9e3c-2d4f-4b8a-9c6e-0f1d2e3a4b55
              sectorId: 5b1f6c2e-0d3a-4c8e-9a51-2f7d1e8c4b10
              sectorName: Фан-зона A
              row: 5
              number: 13
              price: 1200
              status: FREE
              x: 430
              y: 188

    CreateReservationRequest:
      type: object
      required: [eventId, seatIds]
      properties:
        eventId:
          type: string
          format: uuid
          example: 9c4e1a7b-2f3d-4e6a-8b1c-7d2e5f9a3c01
        seatIds:
          type: array
          description: Обрані місця, від 1 до 4 (ліміт NFR-11)
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items:
            type: string
            format: uuid
          example:
            - 3f8a2c1d-6e4b-4a9f-b2d7-1c5e8f0a9b22
            - 7a1b9e3c-2d4f-4b8a-9c6e-0f1d2e3a4b55
        insurance:
          type: boolean
          default: false
          description: Додати страховку квитка (повернення 100% вартості)
          example: false

    UpdateReservationRequest:
      type: object
      required: [insurance]
      properties:
        insurance:
          type: boolean
          example: true

    ReservedSeat:
      type: object
      required: [seatId, sectorName, row, number, price]
      properties:
        seatId:
          type: string
          format: uuid
          example: 3f8a2c1d-6e4b-4a9f-b2d7-1c5e8f0a9b22
        sectorName:
          type: string
          example: Фан-зона A
        row:
          type: integer
          format: int32
          minimum: 1
          example: 5
        number:
          type: integer
          format: int32
          minimum: 1
          example: 12
        price:
          type: number
          format: double
          minimum: 0
          example: 1200

    Reservation:
      type: object
      required: [id, eventId, status, seats, insurance, total, currency, reservedUntil, createdAt]
      properties:
        id:
          type: string
          format: uuid
          example: 0e7c2a91-4b6d-4f3e-8a2c-91d5b7e4f003
        eventId:
          type: string
          format: uuid
          example: 9c4e1a7b-2f3d-4e6a-8b1c-7d2e5f9a3c01
        status:
          $ref: '#/components/schemas/ReservationStatus'
        seats:
          type: array
          minItems: 1
          maxItems: 4
          items:
            $ref: '#/components/schemas/ReservedSeat'
          example:
            - seatId: 3f8a2c1d-6e4b-4a9f-b2d7-1c5e8f0a9b22
              sectorName: Фан-зона A
              row: 5
              number: 12
              price: 1200
            - seatId: 7a1b9e3c-2d4f-4b8a-9c6e-0f1d2e3a4b55
              sectorName: Фан-зона A
              row: 5
              number: 13
              price: 1200
        insurance:
          type: boolean
          example: false
        total:
          type: number
          format: double
          minimum: 0
          description: Сума до оплати в гривнях
          example: 2400
        currency:
          type: string
          enum: [UAH]
          example: UAH
        reservedUntil:
          type: string
          format: date-time
          description: До цього часу місця тримаються за покупцем
          example: '2026-11-20T10:10:00Z'
        createdAt:
          type: string
          format: date-time
          example: '2026-11-20T10:00:00Z'

    ProblemDetails:
      type: object
      description: Опис помилки за RFC 7807
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          description: Посилання на тип помилки
          example: https://api.ticketwave.example/problems/validation-error
        title:
          type: string
          description: Коротка назва помилки
          example: Validation error
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
          example: 400
        detail:
          type: string
          description: Пояснення для цього конкретного випадку
          example: Поле seatIds має містити від 1 до 4 елементів
        instance:
          type: string
          format: uri-reference
          description: Запит, у якому сталася помилка
          example: /reservations
        traceId:
          type: string
          description: Ідентифікатор запиту для пошуку в логах
          example: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
        errors:
          type: array
          description: Список помилок валідації по полях (тільки для 400 і 422)
          items:
            $ref: '#/components/schemas/FieldError'
        conflictingSeatIds:
          type: array
          description: Місця, які вже зайняті (тільки для 409)
          items:
            type: string
            format: uuid

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          example: seatIds
        message:
          type: string
          example: Має містити від 1 до 4 елементів

  responses:
    BadRequest:
      description: Некоректний запит (неправильний формат полів або параметрів)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://api.ticketwave.example/problems/validation-error
            title: Validation error
            status: 400
            detail: Запит містить некоректні поля
            instance: /reservations
            errors:
              - field: seatIds
                message: Має містити від 1 до 4 елементів
    Unauthorized:
      description: Токен відсутній, недійсний або прострочений
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://api.ticketwave.example/problems/unauthorized
            title: Unauthorized
            status: 401
            detail: Access token прострочений, увійдіть знову
            instance: /reservations
    NotFound:
      description: Ресурс не знайдено
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://api.ticketwave.example/problems/not-found
            title: Not found
            status: 404
            detail: Бронювання 0e7c2a91-4b6d-4f3e-8a2c-91d5b7e4f003 не знайдено
            instance: /reservations/0e7c2a91-4b6d-4f3e-8a2c-91d5b7e4f003
    SeatConflict:
      description: Одне або кілька місць уже зайняті
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://api.ticketwave.example/problems/seat-taken
            title: Seat already taken
            status: 409
            detail: Місце вже забронював інший покупець
            instance: /reservations
            conflictingSeatIds:
              - 7a1b9e3c-2d4f-4b8a-9c6e-0f1d2e3a4b55
    UnprocessableEntity:
      description: Запит коректний за формою, але порушує бізнес-правило
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://api.ticketwave.example/problems/ticket-limit
            title: Ticket limit exceeded
            status: 422
            detail: На одну подію можна мати не більше 4 квитків, у вас уже 3
            instance: /reservations
    InternalError:
      description: Внутрішня помилка сервера
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://api.ticketwave.example/problems/internal-error
            title: Internal server error
            status: 500
            detail: Спробуйте ще раз пізніше
            instance: /reservations
